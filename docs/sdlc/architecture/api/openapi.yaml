components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        currency:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - password_hash
      - currency
      - is_active
      - created_at
    sessions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
      required:
      - id
      - user_id
      - token_hash
      - created_at
      - last_seen_at
      - expires_at
      - revoked
    categories:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        is_default:
          type: boolean
        is_fallback:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - name
      - is_default
      - is_fallback
      - created_at
    expenses:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        amount:
          type: number
        expense_date:
          type: string
          format: date
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - category_id
      - amount
      - expense_date
      - created_at
      - updated_at
